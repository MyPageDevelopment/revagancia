<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b0b0f" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="lights" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#g)" />

  <!-- stage lights -->
  <g opacity=".85">
    <path d="M140 0 L360 0 L260 520 Z" fill="url(#lights)" />
    <path d="M480 0 L700 0 L560 560 Z" fill="url(#lights)" />
    <path d="M900 0 L1120 0 L1000 540 Z" fill="url(#lights)" />
    <path d="M1240 0 L1460 0 L1360 520 Z" fill="url(#lights)" />
  </g>

  <!-- crowd silhouette -->
  <g fill="#000" opacity=".6">
    <path d="M0 720 C120 680 220 760 340 720 C460 680 560 760 680 720 C800 680 900 760 1020 720 C1140 680 1240 760 1360 720 C1480 680 1560 740 1600 720 L1600 900 L0 900 Z" />
  </g>

  <!-- subtle label -->
  <g fill="#fff" opacity=".28" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="80" y="820" font-size="28" letter-spacing="4">LIVE PLACEHOLDER</text>
  </g>
